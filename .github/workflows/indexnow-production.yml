name: IndexNow after production deployment

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  notify-changed-public-posts:
    if: github.event.deployment.environment == 'Production' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find previous successful production deployment
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const currentId = context.payload.deployment.id;
            const currentSha = context.payload.deployment.sha;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'Production',
              per_page: 100,
            });
            const currentIndex = deployments.findIndex((deployment) => deployment.id === currentId);
            if (currentIndex < 0) {
              core.notice('Current production deployment was not found in GitHub history; skipping IndexNow safely.');
              core.setOutput('skip', 'true');
              return;
            }
            for (const deployment of deployments.slice(currentIndex + 1)) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 20,
              });
              if (statuses.some((status) => status.state === 'success')) {
                core.setOutput('base_sha', deployment.sha);
                core.setOutput('head_sha', currentSha);
                core.setOutput('skip', 'false');
                return;
              }
            }
            core.notice('No previous successful production deployment found; skipping historical URL submission.');
            core.setOutput('skip', 'true');

      - name: Check out deployed revision
        if: steps.baseline.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.baseline.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install TypeScript parser
        if: steps.baseline.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Notify only changed public blog URLs
        if: steps.baseline.outputs.skip != 'true'
        run: node scripts/indexnow-changed-posts.mjs "${{ steps.baseline.outputs.base_sha }}" "${{ steps.baseline.outputs.head_sha }}"
